name: Installer
# PANOPTICA Setup on Windows (0.47): builds it with test packages inside (signed with a throwaway key, 0.49) and runs it end to
# end (tools/installer-e2e.mjs): a licence file from the builder, PANOPTICA in the background (the startup task) with no script
# to run by hand, an update from a fake GitHub installed by the app and restarted by the task, Setup over the running install,
# the uninstaller. Since 0.52 Setup's Node comes from a runtime file, and the updates bring other Nodes (swapped, put back
# when PANOPTICA does not start on one, refused when forged). (Setup for macOS, 0.48 to 0.50, is gone since 0.51.)
# For pull requests that touch the installer, the licence or the update path, and on demand.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'installer/**'
      - 'tools/installer-*.mjs'
      - 'reset-password.*'
      - 'tools/builder/**'
      - 'update.bat'
      - 'apps/server/src/updates.ts'
      - 'apps/server/src/licence.ts'
      - 'apps/server/src/signature.ts'
      - 'apps/server/src/runtime.ts'
      - 'apps/server/src/brand.ts'
      - 'tools/runtime-file.mjs'
      - '.github/workflows/installer.yml'
permissions:
  contents: read
jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: The app packaged, newer ones, and the runtime files, signed with a throwaway key
        shell: bash
        run: |
          npm run build
          node tools/package.mjs "$RUNNER_TEMP/a" --no-web
          node tools/package.mjs "$RUNNER_TEMP/b" --no-web --version 99.0.0
          node tools/installer-e2e.mjs prepare "$RUNNER_TEMP/a/panoptica" "$RUNNER_TEMP/b/panoptica" "$RUNNER_TEMP/work"
      - name: Build PANOPTICA Setup
        shell: pwsh
        run: |
          node tools/installer-build.mjs --packages "$env:RUNNER_TEMP\work\packages"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /Q /DAppVersion=test installer\panoptica.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install, set up, update, uninstall
        shell: bash
        run: node tools/installer-e2e.mjs run out/installer/PANOPTICA-Setup-test.exe "$RUNNER_TEMP/work"
