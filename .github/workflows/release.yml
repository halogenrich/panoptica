name: Release
# On main: when package.json has a version without a release yet, check everything, then publish
# its packages (the built app, no source: panoptica-<modules>.zip per combination of modules, and panoptica.zip with every
# module), each with its SHA-256 and PANOPTICA's signature, as release v<version>, with that version's
# CHANGELOG section as notes; since 0.52 also panoptica-node-<version>-win-x64.zip, the Node installs made by Setup run on.
# The signing key is the repository secret SIGNING_KEY; its public half is release.pub.
# The lab computers download it from Admin settings › Updates.
# 0.51: the same release is also published to the public repository PANOPTICA-Labs/panopticalm, which holds releases only
# (no source), so lab servers need no token: secret RELEASES_TOKEN, a fine-grained token with Contents read and write on that
# repository alone. Without the secret the release is made here only, and the log says so. The release here stays too: labs on
# 0.50 or older find their update here, and a lab whose public check fails falls back to it.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      made: ${{ steps.v.outputs.exists != '1' }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.v.outputs.exists != '1'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - if: steps.v.outputs.exists != '1'
        run: npm ci && npm run check && npx playwright install --with-deps chromium && npm run test:browser && npm run test:browser:core && npm audit --audit-level=moderate
      - if: steps.v.outputs.exists != '1'
        name: Package and publish
        run: |
          v=${{ steps.v.outputs.version }}
          # the built app, with no source code, signed by PANOPTICA: one package per combination of modules (0.46), and
          # panoptica.zip with every module for labs on older versions; lab servers install nothing else
          node tools/release-packages.mjs release
          # Node for Windows as a release file of its own (0.52), signed: Setup carries it, and installs made by Setup take it
          # with an update when it is not the Node they run
          node tools/runtime-file.mjs release
          node tools/notes.mjs "$v" > notes.md
          gh release create "v$v" release/* --title "PANOPTICA $v" --notes-file notes.md --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      - if: steps.v.outputs.exists != '1'
        name: Publish to the public repository
        run: |
          v=${{ steps.v.outputs.version }}
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No RELEASES_TOKEN secret: v$v is published in this repository only, not in $PUBLIC."
            exit 0
          fi
          # anyone can read it: its README says what it is, and nothing else goes there
          b64() { base64 -w0 "$1"; }
          cur=$(gh api "repos/$PUBLIC/contents/README.md" --jq '.sha + " " + .content' 2>/dev/null || true)
          if [ "$(echo "${cur#* }" | tr -d '\n' | base64 -d 2>/dev/null)" != "$(cat tools/releases-readme.md)" ]; then
            gh api -X PUT "repos/$PUBLIC/contents/README.md" -f message="What this repository is" \
              -f content="$(b64 tools/releases-readme.md)" ${cur:+-f sha="${cur%% *}"} > /dev/null
            echo "README of $PUBLIC updated"
          fi
          if gh release view "v$v" --repo "$PUBLIC" > /dev/null 2>&1; then echo "v$v is already in $PUBLIC"; exit 0; fi
          gh release create "v$v" release/* --repo "$PUBLIC" --title "PANOPTICA $v" --notes-file notes.md
          echo "Published v$v in $PUBLIC"
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PUBLIC: PANOPTICA-Labs/panopticalm
  # PANOPTICA Setup (0.47): the one Windows installer every lab uses with its licence file; since 0.49 it carries the release's
  # signed packages and needs no internet
  setup:
    needs: release
    if: needs.release.outputs.made == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Build and publish PANOPTICA Setup
        shell: pwsh
        run: |
          $v = "${{ needs.release.outputs.version }}"
          # the release's signed packages go inside Setup (0.49): it installs the one the lab's licence file names; its Node
          # comes from the release's runtime file (0.52), downloaded with them
          gh release download "v$v" --pattern "panoptica-*.zip*" --dir "$env:RUNNER_TEMP\packages"
          node tools/installer-build.mjs --packages "$env:RUNNER_TEMP\packages"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /Q "/DAppVersion=$v" installer\panoptica.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $f = "out\installer\PANOPTICA-Setup-$v.exe"
          (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower() + "  PANOPTICA-Setup-$v.exe" | Out-File -Encoding ascii "$f.sha256"
          gh release upload "v$v" $f "$f.sha256" --clobber
          # and in the public repository (0.51), when the release job published there
          if ($env:RELEASES_TOKEN) {
            $env:GH_TOKEN = $env:RELEASES_TOKEN
            gh release upload "v$v" $f "$f.sha256" --clobber --repo PANOPTICA-Labs/panopticalm
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
