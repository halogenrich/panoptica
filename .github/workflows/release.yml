name: Release
# On main: when package.json has a version without a release yet, check everything, then publish
# panoptica.zip (the built app, no source), its SHA-256 and PANOPTICA's signature as release v<version>, with that version's
# CHANGELOG section as notes. The signing key is the repository secret SIGNING_KEY; its public half is release.pub.
# The lab computers download it from Admin settings › Updates.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.v.outputs.exists != '1'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.v.outputs.exists != '1'
        run: npm ci && npm run check && npx playwright install --with-deps chromium && npm run test:browser && npm run test:browser:core && npm audit --audit-level=moderate
      - if: steps.v.outputs.exists != '1'
        name: Package and publish
        run: |
          v=${{ steps.v.outputs.version }}
          # the built app, with no source code, signed by PANOPTICA: lab servers install nothing else
          node tools/package.mjs out --no-web --boot
          (cd out && zip -qr ../panoptica.zip panoptica)
          node tools/sign-package.mjs panoptica.zip
          sha256sum panoptica.zip > panoptica.zip.sha256
          node tools/notes.mjs "$v" > notes.md
          gh release create "v$v" panoptica.zip panoptica.zip.sha256 panoptica.zip.sig --title "PANOPTICA $v" --notes-file notes.md --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
