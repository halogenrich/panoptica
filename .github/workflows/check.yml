name: Check
# Typecheck, unit tests, server security checks and the production build, on every pull request.
# Once per commit (0.50.1): on the pull request only, since running on the push as well doubled every run.
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      # both systems always finish, so one push shows every failure (0.50.1)
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [26]
        # An install made before 0.50.1 keeps its Node 22 through in-app updates (the update does not replace the runtime yet),
        # so the package must still run there: checked on Linux until the update carries the runtime.
        include:
          - os: ubuntu-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      # the main flows clicked through in Chromium, on the packaged app (Linux is enough: it is the same web app)
      - if: runner.os == 'Linux' && matrix.node == 26
        run: npx playwright install --with-deps chromium && npm run test:browser && npm run test:browser:core
      - run: npm audit --audit-level=moderate
