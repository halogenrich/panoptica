name: Check
# Typecheck, unit tests, server security checks and the production build, on every pull request.
# Once per commit (0.50.1): on the pull request only, since running on the push as well doubled every run.
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      # both systems always finish, so one push shows every failure (0.50.1)
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Node 26 only since 0.53: Setup and updates bring it (0.52), and an install on an older Node refuses the update
        node: [26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      # the main flows clicked through in Chromium, on the packaged app (Linux is enough: it is the same web app); the phone
      # layout also in WebKit, Safari's engine, as an iPhone (0.55)
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium webkit && npm run test:browser -- --webkit && npm run test:browser:core
      - run: npm audit --audit-level=moderate
