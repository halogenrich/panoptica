name: Check
# Typecheck, unit tests, server security checks and the production build, on every push and pull request.
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # the main flows clicked through in Chromium, on the packaged app (Linux is enough: it is the same web app)
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium && npm run test:browser && npm run test:browser:core
      - run: npm audit --audit-level=moderate
